services:
  db:
    image: postgres:16-alpine
    container_name: aivoa_deviation_db
    environment:
      POSTGRES_USER: aivoa
      POSTGRES_PASSWORD: aivoa_dev_password
      POSTGRES_DB: aivoa_deviation
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aivoa -d aivoa_deviation"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
